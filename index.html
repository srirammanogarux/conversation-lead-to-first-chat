    chip.classList.add('selected', 'punch');
    setTimeout(() => chip.classList.remove('punch'), 360);
    await collect(PICK_EMOJI[PICKS[i]], chip, 5);    // 🎬/📖/🌱 takes the stage, then feeds the bar
    if (aborted(g)) return;
    await wait(260); if (aborted(g)) return;
  }
  // third pick lands → auto-advance, no button needed
  await wait(500); if (aborted(g)) return;
  const selectedChips = PICKS.map(p => inputDock.querySelector(`[data-topic="${p}"]`));
  fadeDockExcept(selectedChips);
  await wait(360); if (aborted(g)) return;
  await morphChipsTogether(PICKS.map(p => ({
    chip: inputDock.querySelector(`[data-topic="${p}"]`),
    html: `<span class="emo">${PICK_EMOJI[p]}</span>${p}`
  })));
  if (aborted(g)) return;
  await closeDock(); if (aborted(g)) return;

  await sarahThinks(g, `🎬 + 📖 + 🌱 … good taste 🤔`);
  if (aborted(g)) return;
  await sarahSays(g, `Movies AND books? We will never run out of things to talk about 😄`, { loadingMs: 1020 });
  await wait(700);
}

/* ─── 5 · Occupation: real industry, styled like the interest cloud ─── */
async function scene5_occupation(g) {
  CURRENT_SCENE = 5; updateSceneUI();
  await sarahSays(g, `And what do you do? It shapes our conversations.`, { loadingMs: 1100 });
  await wait(800); if (aborted(g)) return;

  const chipsHTML = OCCUPATIONS.map(([emo, label], i) =>
    `<div class="topic-chip" data-topic="${label}" style="animation-delay:${i * 26}ms"><span class="emo">${emo}</span>${label}</div>`
  ).join('');
  openDock(`
    <div class="dock-label">So we practice conversations from your world</div>
    <div class="chip-wrap">${chipsHTML}</div>
  `, 'right-align');
  await wait(600); if (aborted(g)) return;

  const chip = inputDock.querySelector(`[data-topic="${OCC_PICK[1]}"]`);
  await tapAt(chip, { lead: 240 }); if (aborted(g)) return;
  chip.classList.add('selected', 'punch');
  await collect(OCC_PICK[0], chip, 12);
  if (aborted(g)) return;
  fadeDockExcept([chip]);
  await wait(360); if (aborted(g)) return;
  await flipMorph(chip, `<span class="emo">${OCC_PICK[0]}</span>${OCC_PICK[1]}`);
  if (aborted(g)) return;
  await closeDock(); if (aborted(g)) return;
  await wait(600);
}

/* ─── 6 · Gender: quick, with its why ─── */
async function scene6_gender(g) {
  CURRENT_SCENE = 6; updateSceneUI();
  await sarahSays(g, `Last quick one about you.`, { loadingMs: 1020 });
  await wait(800); if (aborted(g)) return;

  const opts = ['Male', 'Female', 'Prefer not to say'];
  openDock(`
    <div class="dock-label">So I talk about you the right way</div>
    <div class="quick-wrap">
      ${opts.map((o, i) => `<div class="quick-chip" data-opt="${o}" style="animation-delay:${i * 55}ms">${o}</div>`).join('')}
    </div>
  `, 'right-align');
  await wait(650); if (aborted(g)) return;

  const pick = inputDock.querySelector('[data-opt="Male"]');
  await tapAt(pick, { lead: 240 }); if (aborted(g)) return;
  pick.classList.add('selected', 'punch');
  await collect('🙋', pick, 10);
  if (aborted(g)) return;
  fadeDockExcept([pick]);
  await wait(340); if (aborted(g)) return;
  await flipMorph(pick, `Male`); if (aborted(g)) return;
  await closeDock(); if (aborted(g)) return;
  await wait(450);
}

/* ─── 9 · Impromptu: get-to-know-you done (⭐1) → Assembly Loader → question → ⭐2 ─── */
async function scene7_impromptu(g) {
  CURRENT_SCENE = 7; updateSceneUI();
  await wait(400); if (aborted(g)) return;

  // Act 1 complete: a star flies from the chat up to the tray (⭐1)
  const { bubble: doneBubble } = await sarahSays(g, `That's everything I wanted to know 😊`, { loadingMs: 1020 });
  await wait(500); if (aborted(g)) return;
  PROGRESS = 70; setProgress(PROGRESS);
  await flyStarToSlot(g, doneBubble, 0);
  if (aborted(g)) return;
  showToast('Great, I know you now!');
  await wait(800); if (aborted(g)) return;

  // Assembly Loader — Sarah's voice, echoing their real answers, then becomes the question
  const q = await assembleQuestion(g,
    [
      `Checking everything you told me…`,
      `You like movies and books 🎬 📖`,
      `And you work in an office 💼`
    ],
    `Here is your first question. Tell me about a story you love, from a movie or a book.`,
    `यह रहा आपका पहला सवाल। मुझे कोई ऐसी कहानी बताइए जो आपको पसंद हो, किसी फ़िल्म या किताब से।`
  );
  if (aborted(g) || !q) return;
  PROGRESS = 86; setProgress(PROGRESS);
  await wait(700); if (aborted(g)) return;

  // First time the mic appears — coach it here
  micPill.classList.add('visible', 'idle');
  await wait(400); if (aborted(g)) return;
  const coach = await coachMark({
    target: micPill, main: 'Tap to Speak', sub: 'बोलने के लिए टैप करें',
    place: 'above', dwell: 1500
  });
  await coach.dismiss();
  if (aborted(g)) return;

  // stuck beat → frame hint (not a full sentence — their words, our scaffold)
  await wait(1500); if (aborted(g)) return;
  const hintChipRow = addHintChip();
  await wait(800); if (aborted(g)) return;
  await tapAt(hintChipRow.querySelector('.hint-chip'), { lead: 240 }); if (aborted(g)) return;
  hintChipRow.remove();
  const hintRow = addHintSuggestion(`You can start with: "I love the story of..."`, `आप शुरू कर सकते हैं: "I love the story of..."`);
  await wait(1600); if (aborted(g)) return;

  await userSpeaks(g, `I love the story of 3 Idiots. It is about friends and dreams.`, async () => {
    const hb = hintRow.querySelector('.hint-suggest');
    if (hb) hb.classList.add('fade');
    await wait(300);
    hintRow.remove();
  });
  if (aborted(g)) return;

  // Celebration: they answered with no options. That's the whole game.
  PROGRESS = 100; setProgress(100);
  progressFill.classList.remove('glowpulse'); void progressFill.offsetWidth;
  progressFill.classList.add('glowpulse');

  // First-conversation reward: a star flies FROM the answer bubble → the tray
  // (star 2, since star 1 is already earned), then the achievement toast.
  const answerBubble = chat.querySelector('.bubble-row.user:last-child .bubble');
  await wait(360); if (aborted(g)) return;
  await flyStarToSlot(g, answerBubble, 1);
  if (aborted(g)) return;
  showToast('You had your first conversation!');
  await wait(700); if (aborted(g)) return;

  await sarahSaysSplit(g, [
    `You did it! Your first real answer. No options, just you 🎉`,
    `Next time: we practice meeting someone new. The friendly kind 😄 See you tomorrow!`
  ], { loadingMs: 1230 });
  await wait(2600);
}

/* ─── Master loop ─── */
const SCENES = [null, scene1_greeting, scene2_agenda, scene3_translateCoach, scene4_interests, scene5_occupation, scene6_gender, scene7_impromptu];

async function runFlow() {
  const g = ++CURRENT_GEN;
  while (g === CURRENT_GEN) {
    resetAll();
    await wait(240);
    if (g !== CURRENT_GEN) break;
    try {
      for (let i = 1; i <= 7; i++) { await SCENES[i](g); if (g !== CURRENT_GEN) break; }
    } catch (e) { console.error('Scene failed:', e); }
    if (g !== CURRENT_GEN) break;
    loopFade.classList.add('show');
    await wait(700);
    if (g !== CURRENT_GEN) break;
    await wait(160);
  }
}

/* ─── Scene jump: rebuild prior chat state instantly, then play forward ─── */
function addChoiceBubble(html) {
  addBubble({ kind: 'user', html });
  const b = chat.lastElementChild.querySelector('.bubble');
  b.classList.add('choice'); b.classList.remove('user');
}
function snapshotForScene(target) {
  if (target >= 2) {
    addBubble({ kind: 'bot', html: `Hi! I'm Sarah 👋`, tools: [] });
    addBubble({
      kind: 'bot',
      html: `See these 3 stars up top? ⭐ That's today's plan. Let me walk you through.`,
      tools: ['translate', 'speaker'],
      translation: `ऊपर ये 3 सितारे देख रहे हैं? ⭐ यही आज की योजना है। मैं आपको समझाती हूँ।`
    });
    requestAnimationFrame(() => { positionSarah(); showSarah(); });
    PROGRESS = 10;
  }
  if (target >= 3) { PROGRESS = 14; }   // agenda tour leaves no chat bubbles
  if (target >= 4) {
    addBubble({ kind: 'bot', html: `If my English is hard, tap this button. It shows my words in your language.`, tools: ['translate', 'speaker'] });
    PROGRESS = 16;
  }
  if (target >= 5) {
    addBubble({ kind: 'bot', html: `First: what do you love? Pick a few.`, tools: ['translate', 'speaker'] });
    PICKS.forEach(p => addChoiceBubble(`<span class="emo">${PICK_EMOJI[p]}</span>${p}`));
    addBubble({ kind: 'bot', html: `Movies AND books? We will never run out of things to talk about 😄`, tools: ['translate', 'speaker'] });
    PROGRESS = 31;
  }
  if (target >= 6) {
    addBubble({ kind: 'bot', html: `And what do you do? It shapes our conversations.`, tools: ['translate', 'speaker'] });
    addChoiceBubble(`<span class="emo">${OCC_PICK[0]}</span>${OCC_PICK[1]}`);
    PROGRESS = 44;
  }
  if (target >= 7) {
    addBubble({ kind: 'bot', html: `Last quick one about you.`, tools: ['translate', 'speaker'] });
    addChoiceBubble(`Male`);
    PROGRESS = 56;
  }
  setProgress(PROGRESS);
  scrollChat();
}

async function jumpTo(sceneNum) {
  const g = ++CURRENT_GEN;
  resetAll();
  CURRENT_SCENE = sceneNum; updateSceneUI();
  if (sceneNum > 1) snapshotForScene(sceneNum);
  await wait(200);
  if (g !== CURRENT_GEN) return;
  for (let i = sceneNum; i <= 7; i++) { await SCENES[i](g); if (g !== CURRENT_GEN) return; }
  loopFade.classList.add('show');
  await wait(700);
  if (g !== CURRENT_GEN) return;
  runFlow();
}

/* ─── Helpers ─── */
function scrollChat() { requestAnimationFrame(() => { chat.scrollTop = chat.scrollHeight; }); }
function updateSceneUI() {
  readout.textContent = 'Scene ' + CURRENT_SCENE;
  sceneJumps.querySelectorAll('button').forEach(b => b.classList.toggle('active', parseInt(b.dataset.scene, 10) === CURRENT_SCENE));
}

/* ─── Flag / feedback sheet (conversation-specific issues, inline note per chip) ─── */
const FLAG_ISSUES = [
  ['🗣️', "I didn't understand Sarah", 'Which word or question was confusing?'],
  ['👂', 'Sarah misheard me', 'What did she hear wrong?'],
  ['🌀', 'She made up something I never said', 'What did she invent?'],
  ['✏️', 'Wrong correction', 'What should it have been?'],
  ['🙈', 'She ignored what I said', 'What did you say that she skipped?'],
  ['🔁', 'She keeps asking the same thing', 'What is she repeating?'],
  ['📈', 'Too hard for my level', 'Which part felt too advanced?'],
  ['🤖', 'Her reply felt generic / robotic', 'What felt off?'],
  ['💭', 'Something else', 'Tell us what happened']
];
const flagSheet = document.getElementById('flagSheet');
const flagBtn = document.getElementById('flagBtn');
function buildFlagSheet() {
  document.getElementById('flagItems').innerHTML = FLAG_ISSUES.map(([emo, label, ph]) => `
    <div class="fs-item">
      <div class="fs-chip"><span class="fs-emo">${emo}</span><span>${label}</span><span class="fs-check">✓</span></div>
      <div class="fs-note"><textarea placeholder="${ph}"></textarea></div>
    </div>`).join('');
  flagSheet.querySelectorAll('.fs-chip').forEach(c => c.addEventListener('click', () => {
    const item = c.parentElement;
    item.classList.toggle('open');
    if (item.classList.contains('open')) setTimeout(() => item.querySelector('textarea').focus(), 260);
    updateFlagSubmit();
  }));
  updateFlagSubmit();
}
function updateFlagSubmit() {
  document.getElementById('flagSubmit').disabled = !flagSheet.querySelector('.fs-item.open');
}
let FLAG_PREV_PAUSED = false;
function openFlagSheet() {
  buildFlagSheet();
  FLAG_PREV_PAUSED = PAUSED; PAUSED = true;          // freeze the whole flow
  coachScrim.classList.add('show', 'flag-up');       // dim + cover coach overlays
  flagSheet.classList.remove('out');
  requestAnimationFrame(() => flagSheet.classList.add('show'));
}
function closeFlagSheet() {
  flagSheet.classList.remove('show');
  flagSheet.classList.add('out');
  coachScrim.classList.remove('show', 'flag-up');
  PAUSED = FLAG_PREV_PAUSED;                          // resume where it was
  setTimeout(() => { flagSheet.classList.remove('out'); document.getElementById('flagItems').innerHTML = ''; }, 340);
}
flagBtn.addEventListener('click', () => {
  if (flagSheet.classList.contains('show')) closeFlagSheet(); else openFlagSheet();
});
document.getElementById('flagSubmit').addEventListener('click', (e) => { if (e.currentTarget.disabled) return; closeFlagSheet(); showToast('Thanks — feedback noted!'); });
coachScrim.addEventListener('click', () => { if (flagSheet.classList.contains('show')) closeFlagSheet(); });

/* ─── Debug controls ─── */
document.getElementById('replay').addEventListener('click', () => { CURRENT_GEN++; loopFade.classList.remove('show'); runFlow(); });
const pauseBtn = document.getElementById('pauseBtn');
pauseBtn.addEventListener('click', () => { PAUSED = !PAUSED; pauseBtn.textContent = PAUSED ? '▶ Play' : '⏸ Pause'; });
document.getElementById('speedSelect').addEventListener('change', (e) => { SPEED = parseFloat(e.target.value); });
sceneJumps.querySelectorAll('button').forEach(b => b.addEventListener('click', () => jumpTo(parseInt(b.dataset.scene, 10))));

/* ─── Boot ─── */
window.addEventListener('load', () => {
  const qp = new URLSearchParams(location.search);
  const jump = parseInt(qp.get('scene') || '0', 10);
  if (jump >= 1 && jump <= 7) setTimeout(() => jumpTo(jump), 400);
  else setTimeout(runFlow, 500);
});
window.addEventListener('resize', positionSarah);
chat.addEventListener('scroll', positionSarah);
new MutationObserver(() => requestAnimationFrame(positionSarah)).observe(chat, { childList: true, subtree: true });

const sarahImg = document.getElementById('sarah-img');
sarahImg.addEventListener('load', () => { document.getElementById('sarah-fb').style.display = 'none'; sarahImg.style.display = 'block'; });
</script>
